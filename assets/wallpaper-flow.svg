<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" preserveAspectRatio="xMidYMid slice">
  <!-- Desktop wallpaper for the demo Macs, drawn for Unmute: two families of
       broad, softly lit ribbons on a deep neutral night, in the manner of a
       macOS wallpaper. One sweeps up from the lower left to the upper right;
       the other falls from the top left down the right edge, so colour shows
       around the windows wherever they sit. Small, and needs no photo. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c2b"/>
      <stop offset=".6" stop-color="#101219"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="apricot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c8552f"/>
      <stop offset=".35" stop-color="#f29a62"/>
      <stop offset=".7" stop-color="#ffd2a3"/>
      <stop offset="1" stop-color="#fff0dc"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8f2f55"/>
      <stop offset=".5" stop-color="#dd6f8f"/>
      <stop offset="1" stop-color="#ffc2cf"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a4ff"/>
      <stop offset=".45" stop-color="#6d4fc0"/>
      <stop offset="1" stop-color="#2c2163"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset=".5" stop-color="#3866c8"/>
      <stop offset="1" stop-color="#16295e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1120" height="700" fill="url(#base)"/>
  <!-- light behind the notch -->
  <ellipse cx="560" cy="40" rx="360" ry="170" fill="#ffb98a" opacity=".22" filter="url(#haze)"/>
  <g filter="url(#soft)">
    <!-- falling family: top left → down the right edge -->
    <path d="M-40 -20 C 260 60, 520 120, 760 250 S 1060 520, 1180 760 L 1180 600 C 1040 420, 880 250, 690 150 S 260 10, -40 -70 Z" fill="url(#blue)" opacity=".9"/>
    <path d="M-40 60 C 250 120, 500 190, 740 320 S 1040 600, 1150 780 L 1210 780 C 1090 560, 900 330, 700 220 S 280 70, -40 10 Z" fill="url(#violet)" opacity=".95"/>
    <path d="M-40 60 C 250 120, 500 190, 740 320 S 1040 600, 1150 780 L 1170 780 C 1060 590, 880 360, 690 250 S 260 100, -40 40 Z" fill="url(#sheen)"/>
    <!-- rising family: lower left → top right -->
    <path d="M-60 720 C 200 640, 420 500, 640 380 S 980 150, 1200 60 L 1200 200 C 980 260, 780 380, 620 480 S 260 720, -20 790 Z" fill="url(#rose)" opacity=".9"/>
    <path d="M-80 640 C 180 570, 400 430, 620 300 S 960 70, 1200 -20 L 1200 90 C 990 160, 790 290, 630 390 S 260 640, -60 720 Z" fill="url(#apricot)"/>
    <path d="M-80 640 C 180 570, 400 430, 620 300 S 960 70, 1200 -20 L 1200 20 C 990 100, 790 230, 620 340 S 230 600, -70 680 Z" fill="url(#sheen)"/>
  </g>
  <rect width="1120" height="700" fill="url(#vignette)"/>
</svg>
