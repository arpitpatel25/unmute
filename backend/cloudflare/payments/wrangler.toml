name = "unmute-payments"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   DODO_API_KEY          — Bearer token from Dodo dashboard (test_mode key first)
#   DODO_WEBHOOK_SECRET   — Signing secret from Dodo dashboard (whsec_… form)

# Non-secret vars.
#   DODO_API_BASE — flipped to live.dodopayments.com on 2026-06-09. Bank
#     verification is still under review but Dodo lets us accept live
#     payments now (payouts queue until bank clears).
#   DODO_SUBSCRIPTION_PRODUCTS — JSON map of "<plan>:<interval>" → recurring
#     product_id. Placeholder IDs below; real product IDs are filled in at
#     cutover once the recurring products are created in the Dodo dashboard.
#   PUBLIC_API_BASE — public URL of THIS worker, used for the checkout
#     return_url.
[vars]
DODO_API_BASE = "https://live.dodopayments.com"
PUBLIC_API_BASE = "https://unmute-payments.zodpatel.workers.dev"
# LIVE product IDs (created 2026-06-23 in Dodo live mode).
DODO_SUBSCRIPTION_PRODUCTS = '{"dictation:month":"pdt_0NhfhV4cmhPQyxCOBdBJo","dictation:year":"pdt_0NhfhpK3hxCn8DudgkOfB","unmute:month":"pdt_0Nhfhv0mJ4n7Aqs3l5HhQ","unmute:year":"pdt_0NhfhhIsx1PErV2Cb5IpG"}'

[[kv_namespaces]]
binding = "USER_BALANCE"
id = "e7daf8475bd547679f96d0b3ca561519"

[observability]
enabled = true

# ── Test-mode env (verification before go-live) ────────────────────────
# Deploy with:  wrangler deploy --env test   (worker name: unmute-payments-test)
# Set test secrets with:  wrangler secret put <NAME> --env test
#   DODO_API_KEY (test_mode key), DODO_WEBHOOK_SECRET (test webhook secret),
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Real TEST-mode product IDs (created 2026-06-23):
[env.test.vars]
DODO_API_BASE = "https://test.dodopayments.com"
PUBLIC_API_BASE = "https://unmute-payments-test.zodpatel.workers.dev"
DODO_SUBSCRIPTION_PRODUCTS = '{"dictation:month":"pdt_0NhfW2cRjmjUelf9T0Oet","dictation:year":"pdt_0NhfWCxGhFPQZ6vdGpxjs","unmute:month":"pdt_0NhfWJGMJiWXrRp09Xi9T","unmute:year":"pdt_0NhfWPEja2UuYeClGsCb1"}'

[[env.test.kv_namespaces]]
binding = "USER_BALANCE"
id = "e7daf8475bd547679f96d0b3ca561519"

[env.test.observability]
enabled = true
