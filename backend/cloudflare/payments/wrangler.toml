name = "unmute-payments"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   DODO_API_KEY          — Bearer token from Dodo dashboard (test_mode key first)
#   DODO_WEBHOOK_SECRET   — Signing secret from Dodo dashboard (whsec_… form)

# Non-secret vars. DODO_API_BASE flips when going live. DODO_TOPUP_PRODUCTS
# is a JSON map of top-up cents → Dodo product_id (one product per tier).
# PUBLIC_API_BASE is the public URL of THIS worker, used for the checkout
# return_url. Override in a [env.production] block when deploying live.
[vars]
DODO_API_BASE = "https://test.dodopayments.com"
PUBLIC_API_BASE = "https://unmute-payments.zodpatel.workers.dev"
DODO_TOPUP_PRODUCTS = "{}"   # populate with real product IDs after KYC clears

[[kv_namespaces]]
binding = "USER_BALANCE"
id = "e7daf8475bd547679f96d0b3ca561519"

[observability]
enabled = true
