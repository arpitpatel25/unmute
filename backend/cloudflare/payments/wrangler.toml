name = "unmute-payments"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   DODO_API_KEY          — Bearer token from Dodo dashboard (test_mode key first)
#   DODO_WEBHOOK_SECRET   — Signing secret from Dodo dashboard (whsec_… form)

# Non-secret vars.
#   DODO_API_BASE — flipped to live.dodopayments.com on 2026-06-09. Bank
#     verification is still under review but Dodo lets us accept live
#     payments now (payouts queue until bank clears).
#   DODO_SUBSCRIPTION_PRODUCTS — JSON map of "<plan>:<interval>" → recurring
#     product_id. Placeholder IDs below; real product IDs are filled in at
#     cutover once the recurring products are created in the Dodo dashboard.
#   PUBLIC_API_BASE — public URL of THIS worker, used for the checkout
#     return_url.
[vars]
DODO_API_BASE = "https://live.dodopayments.com"
PUBLIC_API_BASE = "https://unmute-payments.zodpatel.workers.dev"
DODO_SUBSCRIPTION_PRODUCTS = '{"dictation:month":"REPLACE_dict_m","dictation:year":"REPLACE_dict_y","unmute:month":"REPLACE_unmute_m","unmute:year":"REPLACE_unmute_y"}'

[[kv_namespaces]]
binding = "USER_BALANCE"
id = "e7daf8475bd547679f96d0b3ca561519"

[observability]
enabled = true
